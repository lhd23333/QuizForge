name: 功能建议
description: 提议新的使用场景或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明当前工作流中的具体困难。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的交互、输入和输出。
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: 兼容与数据影响
      description: 是否涉及题库格式、配置、依赖、联网或数据迁移。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未找到相同建议。
          required: true
