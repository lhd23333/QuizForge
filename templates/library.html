{% extends "base.html" %}
{% from "_icons.html" import icon %}

{% block title %}资料库 · QuizForge{% endblock %}

{% block content %}
<section class="library-shell" aria-label="资料库">
  <aside class="library-sidebar">
    <div class="library-sidebar-head" data-library-root-drop>
      <h1>资料库</h1>
      <div class="library-sidebar-actions">
        <span class="library-local-badge">本机</span>
        <button type="button" id="library-new-markdown" class="library-sidebar-action"
                title="新建顶层 Markdown 文档" aria-label="新建顶层 Markdown 文档">
          {{ icon('file-output') }}
        </button>
        <button type="button" id="library-new-folder" class="library-sidebar-action"
                title="新建顶层文件夹" aria-label="新建顶层文件夹">＋</button>
      </div>
    </div>
    <div id="library-tree" class="library-tree" role="tree" aria-label="文件列表"
         data-library-root-drop>
      <div class="library-loading">正在读取文件…</div>
    </div>
  </aside>

  <div class="split-resizer library-sidebar-resizer" role="separator" tabindex="0"
       aria-label="调整文件树宽度" aria-orientation="vertical"
       title="拖动调整宽度，双击恢复"
       data-split-resizer data-split-owner=".library-shell" data-split-panel=".library-sidebar"
       data-split-property="--library-sidebar-width" data-split-side="left"
       data-split-min="180" data-split-max="440" data-split-main-min="420"
       data-split-key="library-sidebar"></div>

  <div class="library-workspace">
    <div class="library-workspace-bar">
      <span class="library-workspace-hint">本地资料</span>
      <div class="library-split-actions" aria-label="分栏布局">
        <button type="button" class="library-layout-button" data-library-layout="vertical"
                title="左右分栏" aria-label="左右分栏">◫</button>
        <button type="button" class="library-layout-button" data-library-layout="horizontal"
                title="上下分栏" aria-label="上下分栏">⬒</button>
        <button type="button" class="library-layout-button" data-library-layout="single"
                title="关闭分栏" aria-label="关闭分栏">□</button>
      </div>
    </div>
    <div id="library-panes" class="library-panes is-single"></div>
  </div>
</section>

<template id="library-pane-template">
  <section class="library-pane" data-library-pane>
    <div class="library-tabs" role="tablist" aria-label="已打开文件"></div>
    <div class="library-pane-content">
      <div class="library-empty">
        <div class="library-empty-mark" aria-hidden="true">MD</div>
        <h2>未选择文件</h2>
      </div>
    </div>
  </section>
</template>
{% endblock %}

{% block scripts %}
<script src="{{ static_v('js/library-tabs.js') }}" defer></script>
{% endblock %}
