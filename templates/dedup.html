{% extends "base.html" %}
{% block title %}查重 · QuizForge{% endblock %}
{% block content %}
<section class="app-page dedup-page">
  <header class="app-page-head">
    <h1>查重</h1>
  </header>

  <div class="app-surface dedup-workbench">
    <form class="dedup-thresh" id="dedup-scan-form">
      <label>相似度阈值
        <input type="number" id="dedup-threshold" min="0.5" max="1" step="0.05"
               value="{{ threshold }}" class="input">
      </label>
      <button type="submit" class="btn btn-primary" id="dedup-scan-button">开始扫描</button>
      <button type="button" class="btn" id="dedup-pause-button" hidden>暂停</button>
    </form>
    <div class="dedup-progress" id="dedup-progress" role="status">
      <span class="dedup-spinner" aria-hidden="true"></span>
      <div>
        <strong id="dedup-status-title">尚未扫描</strong>
        <p class="muted" id="dedup-status-detail">点击“开始扫描”后才会读取题库</p>
      </div>
    </div>
  </div>

  <div class="app-surface asset-audit-workbench">
    <div class="asset-audit-head">
      <h2>共享图片库</h2>
      <button type="button" class="btn secondary" id="asset-audit-start">扫描未引用图片</button>
    </div>
    <div class="asset-audit-status muted" id="asset-audit-status" role="status">尚未扫描</div>
    <div class="asset-audit-result" id="asset-audit-result" hidden></div>
    <div class="asset-audit-actions">
      <button type="button" class="btn btn-danger" id="asset-audit-delete" hidden>永久删除未引用图片</button>
    </div>
  </div>

  <div id="dedup-results" aria-live="polite"></div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ static_v('js/dedup-scan.js') }}" defer></script>
{% endblock %}
